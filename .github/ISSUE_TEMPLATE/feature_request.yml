name: Feature request
description: Propose a focused website or studio improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the smallest useful result rather than only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: What belongs in the first version, and what should be deferred?
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Data, privacy, accessibility, or rights impact
      description: Note any drafts, roles, public fields, assets, or accessibility concerns.
    validations:
      required: true
