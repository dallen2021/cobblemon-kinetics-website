name: Web and Data

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Web, data, and database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SITE_ACCESS_MODE: private
      APP_BASE_URL: http://localhost:3000
      STUDIO_FIXTURE_MODE: "false"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-fixture-key

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard secrets, private files, and machine paths
        run: pnpm guard

      - name: Check formatting
        run: pnpm format:check

      - name: Validate published data
        run: pnpm data:verify

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Run unit and contract tests
        run: pnpm test

      - name: Install the Playwright browser
        run: pnpm --filter @cobblemon-kinetics/web exec playwright install --with-deps chromium

      - name: Run browser and accessibility smoke tests
        run: pnpm e2e

      - name: Start local Supabase
        run: pnpm db:start

      - name: Rebuild the database from migrations and seed
        run: pnpm db:reset

      - name: Verify generated database types are current
        env:
          DB_TYPES_MAX_ATTEMPTS: "3"
          DB_TYPES_RETRY_DELAY_MS: "15000"
        run: |
          pnpm db:types
          git ls-files --error-unmatch -- apps/web/src/types/database.generated.ts
          git diff --exit-code -- apps/web/src/types/database.generated.ts
          test -z "$(git status --porcelain=v1 --untracked-files=all -- apps/web/src/types/database.generated.ts)"

      - name: Test database policies and constraints
        run: pnpm db:test

      - name: Lint the database schema
        run: pnpm db:lint

      - name: Build the Next.js application
        run: pnpm build:web

      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop --no-backup
